name: CI Variante C (Matrix)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-variant-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: Build, Unit- und Integrationstests
        run: mvn -B -ntp verify

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-variant-c-${{ matrix.service }}
          path: |
            Code/P2/${{ matrix.service }}/target/surefire-reports/
            Code/P2/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-${{ github.sha }}
          path: Code/P2/${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  system-test:
    name: Systemtest
    needs: verify
    uses: ./.github/workflows/_system-test.yml
