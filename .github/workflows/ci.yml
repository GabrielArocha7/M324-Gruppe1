name: CI

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
    paths:
      - "Code/P2/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/_system-test.yml"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: JAR bauen
        run: mvn -B -ntp package -DskipUnitTests

      - name: JAR hochladen
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-${{ github.sha }}
          path: Code/P2/${{ matrix.service }}/target/*.jar
          if-no-files-found: error
          retention-days: 14

  unit-test:
    name: Unit Tests ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: Unit Tests (Surefire)
        run: mvn -B -ntp test

      - name: Testreports hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ matrix.service }}
          path: Code/P2/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  integration-test:
    name: Integrationstests ${{ matrix.service }}
    needs: unit-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ flughafen-service, flug-service ]
    defaults:
      run:
        working-directory: Code/P2/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Code/P2/*/pom.xml

      - name: Integrationstests (Failsafe + Testcontainers MongoDB)
        run: mvn -B -ntp verify -DskipUnitTests

      - name: Testreports hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports-${{ matrix.service }}
          path: Code/P2/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore

  system-test:
    name: Systemtest
    needs: integration-test
    uses: ./.github/workflows/_system-test.yml

  publish:
    name: Publish ${{ matrix.service }}
    needs: system-test
    # nur main, Release-Tags (v*) und manueller Start; Feature-Branches und PRs publizieren nicht
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ flughafen-service, flug-service ]
    steps:
      - uses: actions/checkout@v7

      - name: Getestetes JAR laden
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-${{ github.sha }}
          path: Code/P2/${{ matrix.service }}/target

      - name: Image-Name und Tags bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/m324-${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und publizieren
        id: push
        uses: docker/build-push-action@v7
        with:
          context: Code/P2/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publiziertes Image ausgeben
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo ""
            echo "${{ steps.meta.outputs.tags }}" | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
