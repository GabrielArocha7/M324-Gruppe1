name: P2 CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test airport service
        run: mvn -B -ntp -f Code/P2/flughafen-service/pom.xml test

      - name: Test flight service and integration tests
        run: mvn -B -ntp -f Code/P2/flug-service/pom.xml test
